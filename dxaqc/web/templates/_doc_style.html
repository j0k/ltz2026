<style>
/* Страницы-документы в духе Typora и Craigslist: одна колонка текста, ссылки вместо кнопок, тонкие линейки, без карточек и теней */
body{background:#fff;color:#333;font:16px/1.65 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{background:#fff;border-bottom:0}
header .bar{max-width:760px;padding:22px 24px 0}
header .logo{color:#111;font-weight:700;letter-spacing:0}
header .logo small{color:#999;font-weight:400}
header .bar nav{flex-wrap:wrap;justify-content:flex-end;gap:4px 18px}
header .bar nav a{color:#00c}
main{max-width:760px;padding:4px 24px 56px}
footer{max-width:760px;padding:0 24px 40px;color:#999}
.doc a{color:#00c;text-decoration:none}
.doc a:visited{color:#551a8b}
.doc a:hover{text-decoration:underline}
.doc h1{font-size:2rem;line-height:1.25;color:#111;margin:26px 0 10px;padding-bottom:.3em;border-bottom:1px solid #eee}
.doc h2{font-size:1.3rem;color:#111;margin:40px 0 10px;padding-bottom:.25em;border-bottom:1px solid #eee}
.doc h3{font-size:1rem;color:#111;margin:22px 0 4px}
.doc p{margin:0 0 12px}
.doc ul{margin:0 0 12px;padding-left:1.3em}
.doc li{margin:3px 0}
.doc .muted{color:#777}
.doc .small{font-size:14px}
.doc input[type=file], .doc select{font:inherit;font-size:14px;max-width:100%}
.doc input[type=radio], .doc input[type=checkbox]{margin:0 4px 0 0;vertical-align:-1px}
button.go{font:inherit;color:#00c;background:none;border:0;padding:0;cursor:pointer}
button.go:hover{text-decoration:underline}
button.go.danger{color:#c62828}
button.go.small{font-size:14px}
button.go:focus-visible, .doc a:focus-visible, .doc input:focus-visible, .doc select:focus-visible, .doc textarea:focus-visible{outline:2px solid #00c;outline-offset:2px}
.upload .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:4px}
.doc ul.sets, .doc ul.runs, .doc ul.qlist{list-style:none;padding:0;margin:0}
.sets > li, .qlist > li{padding:10px 0;margin:0;border-top:1px solid #f0f0f0}
.sets > li:first-child, .qlist > li:first-child{border-top:0}
.opts{display:flex;flex-wrap:wrap;gap:2px 18px;margin:6px 0 4px;font-size:15px}
.opts label{white-space:nowrap}
.opts select[name=study]{max-width:200px}
.runs{font-size:15px}
.runs li{display:grid;grid-template-columns:6.8em minmax(0,1fr) auto;gap:0 14px;padding:6px 0;margin:0;border-top:1px solid #f2f2f2}
.runs li:first-child{border-top:0}
.runs time{color:#999;font-variant-numeric:tabular-nums}
.runs .meta{color:#777}
.st-done{color:#1a7f37}
.st-error, .st-rejected{color:#c62828}
.st-wait, .st-queued, .st-running, .st-awaiting_approval{color:#9a6700}
.scroll{overflow-x:auto}
table.metrics{border:0;border-radius:0;background:none;width:100%;font-size:15px}
table.metrics th, table.metrics td{background:none;border:0;border-bottom:1px solid #eee;padding:6px 10px 6px 0;font-size:15px;text-align:left;vertical-align:top}
table.metrics th{color:#777;font-weight:600;font-size:13px;text-transform:none;letter-spacing:0}
table.metrics .n{text-align:right;font-variant-numeric:tabular-nums}
table.metrics .short{display:none}
.doc form.stack label{display:block;margin:12px 0 3px;font-size:14px;color:#555}
.doc form.stack label.inline{display:flex;gap:6px;align-items:baseline;color:#333;font-size:15px}
.doc input[type=text], .doc input[type=password], .doc input[type=number], .doc textarea{font:inherit;font-size:15px;padding:6px 8px;border:1px solid #ccc;border-radius:3px;background:#fff;color:#222;box-sizing:border-box}
.doc input[type=text], .doc input[type=password]{width:100%;max-width:360px}
.doc textarea{width:100%;min-height:130px;resize:vertical}
.doc input[type=number]{width:6.5em;padding:2px 6px;font-size:14px}
.doc .err{color:#c62828}
.doc .ok{color:#1a7f37}
.inline-form{display:inline-flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin:0}
.qmeta{font-size:13px;color:#999}
.qtext{white-space:pre-wrap;margin:4px 0;color:#111;overflow-wrap:anywhere}
.answer{border-left:3px solid #e5e5e5;padding:2px 0 2px 14px;margin:8px 0;overflow-wrap:anywhere}
.answer pre{background:#f6f8fa;padding:10px 12px;overflow-x:auto;font-size:13px;line-height:1.45}
.answer code{font-size:.9em;background:#f6f8fa;padding:0 3px;border-radius:3px}
.answer pre code{background:none;padding:0}
.answer table{border-collapse:collapse;width:auto;border:0;background:none}
.answer th, .answer td{border:1px solid #e5e5e5;padding:4px 8px;background:none;text-transform:none;letter-spacing:0;font-size:14px;color:#333}
@media (max-width:600px){
  header .bar{flex-wrap:wrap;gap:4px 16px}
  header .bar nav{margin-left:0;justify-content:flex-start}
  header .logo small{display:block;margin:0}
  .doc h1{font-size:1.6rem}
  .opts{display:block}
  .opts label{display:block;white-space:normal;margin:4px 0}
  .opts select[name=study]{display:block;width:100%;max-width:100%;margin-top:4px}
  table.metrics .long{display:none}
  table.metrics .short{display:inline}
  table.metrics th, table.metrics td{font-size:14px;padding-right:8px}
  .runs li{grid-template-columns:minmax(0,1fr) auto}
  .runs time{grid-column:1 / -1;font-size:13px}
}
</style>
