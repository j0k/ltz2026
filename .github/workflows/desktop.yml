# Настольное приложение (#159, #166): сборка .exe/.msi на Linux и проверка на настоящей Windows —
# установка, самопроверка, настоящее окно со скриншотом, запросы к работающей программе, MCP по stdio, удаление.
# Отчёт и скриншоты — артефактом и в ветку ci/desktop-results (её забирают через git fetch).
# Запуск вручную или по тегу v*.
name: desktop
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis msitools wixl rsync
      - run: python -m venv .venv && .venv/bin/pip install -q -U pip
      - name: Отметка «запущено» в ветку ci/desktop-build
        run: |
          mkdir -p "$RUNNER_TEMP/ci" && cd "$RUNNER_TEMP/ci" && git init -q && git config user.name desktop-ci && git config user.email ci@ltz2026.ru
          echo "run ${{ github.run_id }} · ${{ github.ref_name }} · ${{ github.sha }} · запущено $(date -u)" > STATUS.txt
          git add -A && git commit -qm "build started" && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci/desktop-build
      - name: Сборка .exe и .msi
        run: packaging/build_windows.sh "$RUNNER_TEMP/build" "$RUNNER_TEMP/dist" 2>&1 | tee "$RUNNER_TEMP/ci/build.log"; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        with: {name: windows, path: "${{ runner.temp }}/dist/*"}
      - name: Журнал сборки в ветку ci/desktop-build
        if: always()
        run: |
          cd "$RUNNER_TEMP/ci"
          echo "run ${{ github.run_id }} · ${{ github.ref_name }} · ${{ github.sha }} · сборка: ${{ job.status }} · $(date -u)" > STATUS.txt
          ls -la "$RUNNER_TEMP/dist" >> STATUS.txt 2>&1 || true
          git add -A && git commit -qm "build ${{ job.status }}" && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci/desktop-build
  test-windows:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {name: windows, path: dist}
      - name: Проверка .exe и .msi
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force results | Out-Null
          $report = New-Object System.Collections.Generic.List[string]
          function Step($name, $ok, $detail) { $mark = if ($ok) { "✓" } else { "✕" }; $report.Add("- $mark **$name** — $detail"); Write-Host "$mark $name — $detail" }
          function Shot($file) {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("results\$file"); $g.Dispose(); $bmp.Dispose()
          }
          $os = (Get-CimInstance Win32_OperatingSystem)
          $report.Add("# DXA QC на Windows — $($os.Caption) $($os.Version), $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC"); $report.Add("")
          $wv = Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" -ErrorAction SilentlyContinue
          $report.Add("WebView2: $($wv.pv)"); $report.Add("")

          # ---------- .exe
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          $t = Measure-Command { Start-Process -Wait $setup.FullName -ArgumentList "/S" }
          $app = "$env:LOCALAPPDATA\Programs\DXA QC"
          Step ".exe: тихая установка" (Test-Path "$app\DXA QC.exe") ("{0:N0} с, {1}" -f $t.TotalSeconds, $setup.Name)
          $st = & "$app\python\python.exe" -X utf8 -m dxaqc.desktop --selftest 2>&1 | Out-String
          $st | Out-File -Encoding utf8 results\selftest-exe.txt
          Step ".exe: самопроверка" ($LASTEXITCODE -eq 0) (($st -split "`n")[0].Trim())
          $ver = & "$app\python\python.exe" -X utf8 -m dxaqc.desktop --version 2>&1 | Out-String
          Step ".exe: версия" ($ver -match "1.0") $ver.Trim()

          # настоящее окно: запускатель, ожидание сервера, запросы, скриншот
          Start-Process "$app\DXA QC.exe"
          $data = "$env:LOCALAPPDATA\DXA QC"; $port = $null
          for ($i = 0; $i -lt 60 -and -not $port; $i++) { Start-Sleep 2; if (Test-Path "$data\instance.json") { $port = (Get-Content "$data\instance.json" | ConvertFrom-Json).port } }
          Step "окно: сервер программы запустился" ([bool]$port) "порт $port"
          if ($port) {
            foreach ($p in "/", "/help", "/about", "/models", "/assistant", "/check/example", "/runs/example/3d") {
              try { $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port$p" -TimeoutSec 30; Step "страница $p" ($r.StatusCode -eq 200) "HTTP $($r.StatusCode), $($r.Content.Length) байт" }
              catch { Step "страница $p" $false $_.Exception.Message }
            }
            Start-Sleep 15; Shot "window-exe.png"
            $log = Get-Content "$data\dxaqc.log" -ErrorAction SilentlyContinue | Out-String
            $log | Out-File -Encoding utf8 results\app-log.txt
            Step "окно: способ" ($log -match "pywebview|браузера") ((($log -split "`n") | Select-String "\[window\]" | Select-Object -Last 1) -as [string])
          }

          # MCP по stdio — как у Claude Desktop
          $req = @('{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}',
                   '{"jsonrpc":"2.0","id":2,"method":"tools/list"}') -join "`n"
          $out = $req | & "$app\python\python.exe" -X utf8 -m dxaqc.desktop --mcp-stdio 2>$null | Out-String
          Step "MCP stdio" ($out -match "analyze_paths") ("{0} строк ответа" -f (($out -split "`n") | Where-Object { $_ }).Count)

          Get-Process python*, pythonw* -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          Start-Process -Wait "$app\Удалить DXA QC.exe" -ArgumentList "/S"; Start-Sleep 10
          Step ".exe: удаление" (-not (Test-Path "$app\python")) "папка программы удалена"

          # ---------- .msi
          $msi = Get-ChildItem dist\*.msi | Select-Object -First 1
          $p = Start-Process -Wait -PassThru msiexec -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v results\msi-install.log"
          $pf = "$env:ProgramFiles\DXA QC"
          Step ".msi: тихая установка" ($p.ExitCode -eq 0 -and (Test-Path "$pf\DXA QC.exe")) "код $($p.ExitCode)"
          $st = & "$pf\python\python.exe" -X utf8 -m dxaqc.desktop --selftest 2>&1 | Out-String
          $st | Out-File -Encoding utf8 results\selftest-msi.txt
          Step ".msi: самопроверка" ($LASTEXITCODE -eq 0) (($st -split "`n")[0].Trim())
          $p = Start-Process -Wait -PassThru msiexec -ArgumentList "/x `"$($msi.FullName)`" /qn"
          Step ".msi: удаление" ($p.ExitCode -eq 0 -and -not (Test-Path "$pf\python")) "код $($p.ExitCode)"

          $report | Out-File -Encoding utf8 results\report.md
          if ($report -match "✕") { Write-Host "есть проблемы"; exit 1 }
      - name: Отчёт — артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: windows-results, path: results}
      - name: Отчёт — в ветку ci/desktop-results
        if: always()
        shell: pwsh
        run: |
          cd results
          git init -q; git config user.name "desktop-ci"; git config user.email "ci@ltz2026.ru"
          "run ${{ github.run_id }} · ${{ github.ref_name }} · ${{ github.sha }}" | Out-File -Encoding utf8 RUN.txt
          git add -A; git commit -qm "Windows: ${{ github.ref_name }} run ${{ github.run_id }}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci/desktop-results
