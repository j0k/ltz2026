# Trac для проекта ЛЦТ 2026 (задача 04, контроль качества DXA).
# Тот же образ bolt-trac и схема, что у zhelicore: env-driven entrypoint, env в docker-volume,
# репозиторий проекта только на чтение. Порт открыт только на localhost;
# наружу публиковать через nginx с basic-auth, как у остальных инстансов.
services:
  ltz-trac:
    image: bolt-trac
    container_name: ltz_trac
    restart: unless-stopped
    entrypoint: /entrypoint.sh
    environment:
      TRAC_PROJECT: "ЛЦТ 2026 · Квантовый Скачок · контроль качества DXA"
      TRAC_BASE_PATH: /trac
      TRAC_BASE_URL: https://ltz2026.ru/trac
      TRAC_REPO_NAME: ltz2026
    volumes:
      - ltz_trac_env:/trac
      - ./entrypoint.sh:/entrypoint.sh:ro
      - /home/jk/exp/LTZ2026/ltz2026:/repo:ro
    ports:
      - "127.0.0.1:8097:8000"

volumes:
  ltz_trac_env:
