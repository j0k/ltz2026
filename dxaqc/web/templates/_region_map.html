{# Всплывающая схема тела (29.09, Юрий): наводишь курсор на область — видно, какая это часть. Работает для любого элемента с data-region:
   hip_left, hip_right, lumbar_spine. Вид спереди, как на схемах в анатомии: правая сторона пациента слева на рисунке. #}
<div id="regMap" class="regmap" role="tooltip" hidden>
  <svg viewBox="0 0 140 236" aria-hidden="true">
    <defs><filter id="rgGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <g class="rg-body"><circle cx="70" cy="19" r="13"/><rect x="65" y="31" width="10" height="9" rx="3"/>
      <path d="M38 48Q70 38 102 48L96 108Q92 132 97 160L98 190H42L43 160Q48 132 44 108Z"/>
      <path class="rg-arm" d="M38 50L22 96L18 132M102 50L118 96L122 132"/>
      <rect x="43" y="192" width="24" height="42" rx="11"/><rect x="73" y="192" width="24" height="42" rx="11"/></g>
    <g class="rg-th">{% for i in range(11) %}<rect x="65.5" y="{{ 46 + i * 5.6 }}" width="9" height="4" rx="1.6"/>{% endfor %}</g>
    <g class="g-lumbar">{% for i in range(5) %}<rect x="63" y="{{ 109 + i * 10.6 }}" width="14" height="8.4" rx="2.4"/>{% endfor %}</g>
    <path class="rg-sac" d="M62 163Q70 176 78 163Z"/>
    <g class="g-hipR rg-hip"><path d="M46 166Q40 176 45 190L56 188L60 172Z" class="rg-wing"/><circle cx="55" cy="192" r="8.5"/><path d="M52 198L48 208L52 212"/><rect x="47" y="208" width="10" height="26" rx="4"/></g>
    <g class="g-hipL rg-hip"><path d="M94 166Q100 176 95 190L84 188L80 172Z" class="rg-wing"/><circle cx="85" cy="192" r="8.5"/><path d="M88 198L92 208L88 212"/><rect x="83" y="208" width="10" height="26" rx="4"/></g>
    <text class="rg-lr" x="6" y="14">Пр</text><text class="rg-lr" x="134" y="14" text-anchor="end">Лев</text>
  </svg>
  <div class="rg-t"><code></code><b></b><span></span></div>
</div>
<style>
.regmap{position:fixed;z-index:1200;width:262px;padding:14px 16px 16px;border-radius:18px;background:#12151c;color:#e8edf3;box-shadow:0 22px 60px rgba(8,10,20,.45),0 0 0 1px rgba(255,255,255,.08);pointer-events:none;display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start;font:13px/1.4 Inter,system-ui,sans-serif}
.regmap[hidden]{display:none}
.regmap svg{width:96px;height:auto;display:block;grid-row:1/3}
.rg-body circle,.rg-body rect,.rg-body path{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.26);stroke-width:1}
.rg-body .rg-arm{fill:none}
.rg-th rect{fill:#465066}.rg-sac{fill:#465066}
.g-lumbar rect{fill:#465066}
.rg-hip circle,.rg-hip rect,.rg-hip .rg-wing{fill:#465066;stroke:none}.rg-hip path:not(.rg-wing){fill:none;stroke:#465066;stroke-width:5;stroke-linecap:round}
.rg-lr{fill:#7f8b9b;font-size:9px;font-weight:700}
.regmap[data-r="lumbar_spine"] .g-lumbar rect{fill:#5aa7ff;filter:url(#rgGlow)}
.regmap[data-r="hip_right"] .g-hipR circle,.regmap[data-r="hip_right"] .g-hipR rect,.regmap[data-r="hip_right"] .g-hipR .rg-wing,
.regmap[data-r="hip_left"] .g-hipL circle,.regmap[data-r="hip_left"] .g-hipL rect,.regmap[data-r="hip_left"] .g-hipL .rg-wing{fill:#5aa7ff;filter:url(#rgGlow)}
.regmap[data-r="hip_right"] .g-hipR path:not(.rg-wing),.regmap[data-r="hip_left"] .g-hipL path:not(.rg-wing){stroke:#5aa7ff}
.rg-t{display:flex;flex-direction:column;gap:3px}
.rg-t code{font:600 11px ui-monospace,Menlo,Consolas,monospace;color:#8fc1ff}
.rg-t b{font-size:15px;letter-spacing:-.01em;color:#fff;line-height:1.25}
.rg-t span{color:#a3abc0;font-size:12px}
td[data-region],.reg-h[data-region],b[data-region]{cursor:help}
td[data-region]{text-decoration:underline dotted rgba(90,140,220,.7);text-underline-offset:3px}
</style>
<script>
(function () {
  const INFO = {
    lumbar_spine: ['Поясничный отдел', 'позвонки L1–L4, прямая проекция; по ТЗ — от гребней подвздошных костей до половины Th12'],
    hip_left: ['Левое бедро', 'проксимальный отдел бедра: головка, шейка, большой вертел и седалищная кость. Левая сторона пациента — справа на схеме'],
    hip_right: ['Правое бедро', 'проксимальный отдел бедра: головка, шейка, большой вертел и седалищная кость. Правая сторона пациента — слева на схеме']
  };
  const tip = document.getElementById('regMap');
  if (!tip) return;
  let cur = null;
  function place(el) {
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    let x = r.left + Math.min(r.width, 60) + 10, y = r.top + r.height / 2 - h / 2;
    if (x + w > innerWidth - 8) x = Math.max(8, r.left - w - 10);
    y = Math.min(Math.max(8, y), innerHeight - h - 8);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  function show(el) {
    const k = el.dataset.region, i = INFO[k];
    if (!i) return;
    cur = el; tip.dataset.r = k;
    tip.querySelector('code').textContent = k; tip.querySelector('b').textContent = i[0]; tip.querySelector('span').textContent = i[1];
    tip.hidden = false; place(el);
  }
  const hide = () => { cur = null; tip.hidden = true; };
  document.addEventListener('pointerover', e => { const el = e.target.closest && e.target.closest('[data-region]'); if (el && el !== cur) show(el); else if (!el && cur) hide(); });
  document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-region]'); if (el) show(el); });
  document.addEventListener('focusout', hide);
  addEventListener('scroll', () => { if (cur) place(cur); }, { passive: true });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });
  document.addEventListener('click', e => { if (cur && !(e.target.closest && e.target.closest('[data-region]'))) hide(); });   // касание на телефоне
})();
</script>
